<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.260.0/lucide.min.js"></script>
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F4EBD0; }
        .status-badge-yes { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .status-badge-maybe { background-color: #fef3c7; color: #92400e; border: 1px solid #fbbf24; }
        .status-badge-no { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-[#4A3B32]">RSVP Dashboard</h1>
            <a href="index.html" class="flex items-center text-sm font-medium bg-white px-4 py-2 rounded-lg border-2 border-[#4A3B32] shadow-[2px_2px_0px_#4A3B32] hover:translate-y-[1px] hover:translate-x-[1px] hover:shadow-[1px_1px_0px_#4A3B32] transition-all text-[#4A3B32]">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Invite
            </a>
        </div>

        <!-- Debug Error Box (Hidden by default) -->
        <div id="debug-error-box" class="hidden mb-8 bg-white p-6 rounded-xl border-4 border-red-500 shadow-[8px_8px_0px_rgba(239,68,68,0.3)]">
            <div class="flex items-start">
                <i data-lucide="alert-octagon" class="w-8 h-8 text-red-500 mr-4 flex-shrink-0"></i>
                <div>
                    <p class="text-xl text-red-600 font-bold mb-1">Dashboard Error</p>
                    <p id="debug-error-message" class="text-sm text-gray-700 font-mono bg-gray-100 p-2 rounded break-words"></p>
                </div>
            </div>
        </div>

        <!-- Metrics Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-6 rounded-2xl border-2 border-[#4A3B32] shadow-[4px_4px_0px_#4A3B32]">
                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Total Guests</p>
                <p id="metric-total" class="text-4xl font-bold text-[#4A3B32]">-</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border-2 border-[#4A3B32] shadow-[4px_4px_0px_#4A3B32]">
                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Attending</p>
                <p id="metric-yes" class="text-4xl font-bold text-[#5F712D]">-</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border-2 border-[#4A3B32] shadow-[4px_4px_0px_#4A3B32]">
                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Maybes</p>
                <p id="metric-maybe" class="text-4xl font-bold text-[#F0A202]">-</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border-2 border-[#4A3B32] shadow-[4px_4px_0px_#4A3B32]">
                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Declined</p>
                <p id="metric-no" class="text-4xl font-bold text-[#D95D39]">-</p>
            </div>
        </div>

        <!-- RSVP List -->
        <div class="bg-white rounded-2xl border-2 border-[#4A3B32] shadow-[4px_4px_0px_#4A3B32] overflow-hidden">
            <div class="p-6 border-b-2 border-gray-100 bg-gray-50 flex justify-between items-center">
                <h2 class="text-lg font-bold text-[#4A3B32]">Guest List</h2>
                <div id="connection-status" class="flex items-center text-sm font-medium text-amber-600 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin mr-2"></i> <span>Connecting to Firebase...</span>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white border-b-2 border-gray-100">
                            <th class="py-4 px-6 font-semibold text-gray-600 text-sm">Guest Name</th>
                            <th class="py-4 px-6 font-semibold text-gray-600 text-sm">Status</th>
                            <th class="py-4 px-6 font-semibold text-gray-600 text-sm">Party Size</th>
                            <th class="py-4 px-6 font-semibold text-gray-600 text-sm">Time Submitted</th>
                        </tr>
                    </thead>
                    <tbody id="rsvp-list" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="4" class="py-10 text-center text-gray-500">
                                <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                                <span id="table-status-text">Waiting for data to load...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        lucide.createIcons();

        const firebaseConfig = {
            apiKey: "AIzaSyD9VZJTpe-Rgz31kiaIzLDX2zutEcx5PgU",
            authDomain: "havok205-9b090.firebaseapp.com",
            projectId: "havok205-9b090",
            storageBucket: "havok205-9b090.firebasestorage.app",
            messagingSenderId: "89324820118",
            appId: "1:89324820118:web:c2bcf5d923ad299a7b14b7"
        };

        const metricTotal = document.getElementById('metric-total');
        const metricYes = document.getElementById('metric-yes');
        const metricMaybe = document.getElementById('metric-maybe');
        const metricNo = document.getElementById('metric-no');
        const rsvpListEl = document.getElementById('rsvp-list');
        const connectionStatus = document.getElementById('connection-status');
        const debugErrorBox = document.getElementById('debug-error-box');
        const debugErrorMessage = document.getElementById('debug-error-message');
        const tableStatusText = document.getElementById('table-status-text');
        
        let db, auth;

        function showError(message) {
            console.error("Dashboard Error:", message);
            debugErrorMessage.innerHTML = message;
            debugErrorBox.classList.remove('hidden');
            connectionStatus.innerHTML = '<i data-lucide="x-circle" class="w-4 h-4 mr-2 text-red-500"></i> <span class="text-red-600">Disconnected</span>';
            connectionStatus.className = "flex items-center text-sm font-medium text-red-600 bg-red-50 px-3 py-1 rounded-full border border-red-200";
            lucide.createIcons();
        }

        function setStatus(message, type = 'loading') {
            if (type === 'success') {
                connectionStatus.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 mr-2 text-green-500"></i> <span class="text-green-600">${message}</span>`;
                connectionStatus.className = "flex items-center text-sm font-medium text-green-600 bg-green-50 px-3 py-1 rounded-full border border-green-200";
            } else {
                connectionStatus.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin mr-2"></i> <span>${message}</span>`;
            }
            lucide.createIcons();
        }

        function updateDashboard(rsvps) {
            try {
                let totalGuests = 0, countYes = 0, countMaybe = 0, countNo = 0;
                
                rsvpListEl.innerHTML = '';

                if (!rsvps || rsvps.length === 0) {
                    rsvpListEl.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-gray-500 font-medium"><i data-lucide="mail-open" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>Database is empty! No RSVPs yet.</td></tr>`;
                    lucide.createIcons();
                    
                    metricTotal.textContent = "0";
                    metricYes.textContent = "0";
                    metricMaybe.textContent = "0";
                    metricNo.textContent = "0";
                    return;
                }

                // Sort safely
                rsvps.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                rsvps.forEach(rsvp => {
                    const status = rsvp.status || 'unknown';
                    const guests = parseInt(rsvp.guests) || 0;
                    
                    if (status === 'yes') { countYes++; totalGuests += guests; }
                    else if (status === 'maybe') { countMaybe++; totalGuests += guests; }
                    else if (status === 'no') { countNo++; }

                    let badgeClass = '';
                    let statusText = '';
                    
                    if (status === 'yes') { badgeClass = 'status-badge-yes'; statusText = 'Attending'; }
                    else if (status === 'maybe') { badgeClass = 'status-badge-maybe'; statusText = 'Maybe'; }
                    else { badgeClass = 'status-badge-no'; statusText = 'Declined'; }

                    // Extremely safe date parsing (handles pending server timestamps)
                    let dateStr = 'Just now';
                    if (rsvp.createdAt && typeof rsvp.createdAt.toDate === 'function') {
                        dateStr = rsvp.createdAt.toDate().toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                    }

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition-colors";
                    tr.innerHTML = `
                        <td class="py-4 px-6 font-semibold text-[#4A3B32]">${rsvp.name || 'Anonymous'}</td>
                        <td class="py-4 px-6">
                            <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${badgeClass}">
                                ${statusText}
                            </span>
                        </td>
                        <td class="py-4 px-6 font-medium text-gray-600">${status === 'no' ? '-' : guests}</td>
                        <td class="py-4 px-6 text-sm text-gray-500">${dateStr}</td>
                    `;
                    rsvpListEl.appendChild(tr);
                });

                metricTotal.textContent = totalGuests;
                metricYes.textContent = countYes;
                metricMaybe.textContent = countMaybe;
                metricNo.textContent = countNo;
                
            } catch (err) {
                showError("Error formatting table data: " + err.message);
            }
        }

        async function initApp() {
            try {
                setStatus("Waking up Firebase...");
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                setStatus("Authenticating admin...");
                await signInAnonymously(auth);
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        setStatus("Fetching RSVPs...");
                        const rsvpsRef = collection(db, 'rsvps');
                        
                        onSnapshot(rsvpsRef, (snapshot) => {
                            try {
                                const data = [];
                                snapshot.forEach((doc) => {
                                    const docData = doc.data();
                                    data.push({
                                        id: doc.id,
                                        ...docData,
                                        // Safe timestamp fallback
                                        timestamp: docData.createdAt ? docData.createdAt.seconds : Date.now() / 1000
                                    });
                                });
                                
                                setStatus("Live Updates On", "success");
                                updateDashboard(data);

                            } catch (err) {
                                showError("Data Parse Error: " + err.message);
                            }

                        }, (error) => {
                            if (error.code && error.code.includes("permission-denied")) {
                                showError("<b>Permission Denied!</b><br>Your database rules are blocking the dashboard from reading data. Ensure your rules allow 'read'.");
                            } else {
                                showError("Firestore Read Error: " + error.message);
                            }
                        });
                    }
                });

            } catch (error) {
                showError("Initialization Error: " + error.message);
            }
        }

        initApp();
    </script>
</body>
</html>
